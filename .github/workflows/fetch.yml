name: Fetch latest journal feeds (14-day window)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 */2 * * *'  # 每 2 小时刷新一次（UTC）

concurrency:
  group: journal-feed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install -r scripts/requirements.txt

      - name: Test feed processing without network requests
        run: python -m unittest discover -s tests -p 'test_build.py' -v

      - name: Build data
        run: |
          python scripts/build.py

      - name: Commit & push if changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/articles.json data/arxiv_cache.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update articles.json"
          git pull --rebase
          git push
